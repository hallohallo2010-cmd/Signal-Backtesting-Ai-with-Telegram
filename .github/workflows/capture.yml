name: capture

on:
  schedule:
    # Every 20 minutes. GitHub's scheduler is best effort and runs late under
    # load, so treat this as "roughly every 20 minutes", never as a guarantee.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      run_analysis:
        description: "Also run parse.py and score.py after capturing"
        type: boolean
        default: false

# One capture at a time. Queued, never cancelled: a cancelled run is a lost
# capture window, and the whole point is that the record has no holes.
concurrency:
  group: signal-capture-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the rebase before pushing has something to rebase.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pandas yfinance

      - name: Capture messages
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python capture.py

      - name: Parse and score
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_analysis }}
        run: |
          python parse.py
          python score.py

      - name: Commit and push changed CSVs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- '*.csv'
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git commit -m "capture: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          branch="${GITHUB_REF_NAME}"
          delay=2
          for attempt in 1 2 3 4; do
            # Another run may have landed rows while this one was working.
            git pull --rebase origin "$branch" || true
            if git push -u origin "HEAD:$branch"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
          done

          echo "::error::Could not push captured data after 4 attempts."
          exit 1
